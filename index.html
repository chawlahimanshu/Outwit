<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUTWIT — are you smarter?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0c1a33; --navy2:#13284a; --cyan:#4fe3ff; --pink:#ff4f8b; --yellow:#ffd84f;
    --green:#4dff9a; --red:#ff5a6a; --ink:#e9f6ff; --muted:#8fb3cc;
    --px:"Silkscreen",monospace; --mono:"Space Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{font-family:var(--mono); color:var(--ink); background:#0c1a33; overflow-x:hidden}
  #scene{position:fixed; inset:0; width:100vw; height:100vh; image-rendering:pixelated; image-rendering:crisp-edges; z-index:-2}
  .scan{position:fixed; inset:0; z-index:-1; pointer-events:none;
        background:repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px)}

  .wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:5vh 14px 40px}
  header{text-align:center; transition:all .3s}
  .logo{font-family:var(--px); font-weight:700; font-size:clamp(46px,11vw,104px); letter-spacing:.06em; margin:0; line-height:1; color:#fff;
        text-shadow:-4px 0 0 var(--pink), 4px 0 0 var(--cyan), 0 6px 0 rgba(0,0,0,.35); cursor:pointer; animation:glitch 5s infinite}
  @keyframes glitch{0%,92%,100%{transform:none} 93%{transform:translateX(-3px) skewX(-6deg)} 95%{transform:translateX(3px)} 97%{transform:translateX(-1px)}}
  .sub{font-family:var(--px); font-size:clamp(14px,2.6vw,22px); letter-spacing:.45em; color:var(--cyan); margin-top:14px;
       text-shadow:2px 2px 0 rgba(0,0,0,.55)}
  body.playing .logo{font-size:40px; animation:none}
  body.playing .sub{display:none}
  body.playing header{margin-bottom:6px}

  main{width:100%; max-width:620px; margin-top:auto}
  .pill{display:inline-block; background:rgba(8,18,38,.7); border:1px solid rgba(79,227,255,.35); padding:6px 12px; font-size:13px; letter-spacing:.12em; color:var(--ink)}
  .center{text-align:center}
  .muted{color:var(--muted)} .small{font-size:12px}

  .frame{position:relative; background:rgba(10,22,46,.88); border:2px solid var(--cyan);
         box-shadow:0 0 0 2px rgba(10,22,46,.9), 0 0 0 4px rgba(79,227,255,.35), 0 0 30px rgba(79,227,255,.25); padding:22px 20px; margin:18px 0 14px}
  .frame .tab{position:absolute; top:-12px; left:16px; background:var(--cyan); color:#04131f; font-family:var(--px); font-size:11px; letter-spacing:.15em; padding:3px 8px}
  .frame .tab.pink{background:var(--pink); color:#fff}

  .rival-row{display:flex; align-items:center; gap:16px}
  .rival-emoji{font-size:54px; line-height:1; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.4))}
  .rival-name{font-family:var(--px); font-size:clamp(20px,4.4vw,30px); letter-spacing:.08em; line-height:1.1}
  .quip{color:var(--muted); font-size:14px; margin-top:6px}

  button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
  .big{display:block; width:100%; font-family:var(--px); font-size:clamp(18px,3.6vw,26px); letter-spacing:.3em; color:#fff;
       background:var(--navy); border:3px solid var(--cyan); padding:18px 10px; box-shadow:0 0 0 3px var(--navy), 0 0 24px rgba(79,227,255,.45);
       transition:background .15s, transform .05s}
  .big:hover{background:var(--navy2)} .big:active{transform:translateY(2px)}
  .big.pink{border-color:var(--pink); box-shadow:0 0 0 3px var(--navy), 0 0 24px rgba(255,79,139,.45)}
  .row{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap}
  .row .grow{flex:1}
  .mini{font-family:var(--px); font-size:12px; letter-spacing:.15em; padding:8px 12px; background:rgba(10,22,46,.85); border:1px solid rgba(79,227,255,.4); color:var(--ink)}
  .mini:hover{border-color:var(--cyan); color:var(--cyan)}
  .tagline{font-size:clamp(12px,2.2vw,15px); letter-spacing:.12em; margin:14px 0 0; text-shadow:1px 1px 0 rgba(0,0,0,.6)}
  .cd{font-family:var(--px); color:var(--yellow); letter-spacing:.1em}

  /* Game */
  .hud{display:flex; justify-content:space-between; align-items:flex-end; font-family:var(--px); font-size:13px; letter-spacing:.15em; margin-bottom:12px}
  .hud b{display:block; font-size:24px; color:var(--yellow)}
  .pips{display:flex; gap:6px; margin-bottom:16px}
  .pip{flex:1; height:10px; background:rgba(255,255,255,.12)}
  .pip.cur{background:var(--yellow); animation:blink 1s steps(2) infinite} .pip.ok{background:var(--green)} .pip.no{background:var(--red)}
  @keyframes blink{50%{opacity:.4}}
  .timebar{display:flex; gap:3px; height:18px; margin-bottom:6px}
  .timebar i{flex:1; background:var(--cyan)} .timebar i.off{background:rgba(255,255,255,.08)}
  .timebar.mid i:not(.off){background:var(--yellow)} .timebar.low i:not(.off){background:var(--red)}
  .secs{font-family:var(--px); font-size:13px; letter-spacing:.2em; text-align:right; color:var(--muted)}
  .tries{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; min-height:0}
  .tries .nope{width:100%; font-family:var(--px); font-size:12px; letter-spacing:.15em; color:var(--red)}
  .tries .tried{font-size:13px; padding:3px 8px; background:rgba(255,90,106,.15); border:1px solid rgba(255,90,106,.45); color:#ffc2c8; text-decoration:line-through; text-transform:uppercase}
  .secs.low{color:var(--red); animation:blink .5s steps(2) infinite}
  .q{font-size:clamp(19px,3.6vw,24px); font-weight:700; line-height:1.35; margin:14px 0 18px}
  .answer{display:flex; gap:8px}
  .answer input{flex:1; min-width:0; font-family:var(--mono); font-size:20px; font-weight:700; color:#fff; background:#06101f;
                border:2px solid rgba(79,227,255,.5); padding:14px; outline:none; text-transform:uppercase; letter-spacing:.05em}
  .answer input:focus{border-color:var(--cyan); box-shadow:0 0 16px rgba(79,227,255,.35)}
  .answer button{font-family:var(--px); font-size:16px; letter-spacing:.15em; padding:0 18px; background:var(--cyan); color:#04131f}
  .pass{display:block; margin:12px 0 0 auto; font-family:var(--px); font-size:12px; letter-spacing:.2em; color:var(--muted)}
  .pass:hover{color:var(--ink)}
  .shake{animation:shake .3s}
  @keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

  .verdict{font-family:var(--px); font-size:clamp(24px,5vw,34px); letter-spacing:.12em}
  .pts{font-family:var(--px); font-size:clamp(40px,9vw,64px); color:var(--yellow); text-shadow:3px 3px 0 #000; animation:pop .45s cubic-bezier(.2,1.7,.4,1)}
  @keyframes pop{from{transform:scale(.2); opacity:0}}
  .ans{font-size:18px; margin-top:6px} .ans b{color:var(--green)}

  .final{font-family:var(--px); font-size:clamp(56px,13vw,96px); line-height:1; color:#fff; text-shadow:-3px 0 0 var(--pink), 3px 0 0 var(--cyan); margin:6px 0}
  .rank{font-family:var(--px); font-size:clamp(16px,3.4vw,22px); letter-spacing:.12em; color:var(--yellow); margin:8px 0}
  .vs{margin:16px 0 4px}
  .vsrow{display:flex; align-items:center; gap:10px; margin:8px 0; font-size:13px}
  .vsrow .n{width:110px; text-align:left; font-family:var(--px); letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .vsrow .bar{flex:1; height:14px; background:rgba(255,255,255,.08)}
  .vsrow .bar i{display:block; height:100%; width:0; transition:width 1.2s steps(24)}
  .vsrow .v{width:60px; text-align:right; font-family:var(--px)}
  .bd{display:flex; gap:10px; padding:10px 0; border-top:1px dashed rgba(79,227,255,.25); font-size:13px}
  .bd .q2{flex:1} .bd .q2 div:last-child{color:var(--muted); margin-top:3px}
  .bd .p{font-family:var(--px); color:var(--yellow); white-space:nowrap}

  .list-row{display:flex; align-items:center; gap:12px; padding:10px 6px; border-top:1px dashed rgba(79,227,255,.25); cursor:pointer}
  .list-row:first-of-type{border-top:none}
  .list-row:hover{background:rgba(79,227,255,.07)}
  .list-row .e{font-size:28px} .list-row .t{flex:1} .list-row .t div:first-child{font-family:var(--px); letter-spacing:.06em}
  .list-row .r{font-family:var(--px); font-size:13px}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); text-align:center; gap:8px}
  .stats b{display:block; font-family:var(--px); font-size:26px; color:var(--yellow)}
  .stats span{font-size:11px; letter-spacing:.15em; color:var(--muted)}
  h3{font-family:var(--px); letter-spacing:.2em; margin:0 0 10px; font-size:16px}

  .ride{margin-top:14px; padding-top:12px; border-top:1px dashed rgba(79,227,255,.25); font-family:var(--px); font-size:11px; letter-spacing:.15em; color:var(--yellow)}
  .ride span{font-size:18px; vertical-align:middle; margin-right:6px}

  .bellbox{margin-top:18px; text-align:left}
  .bell-head{display:flex; justify-content:space-between; align-items:baseline; font-family:var(--px); font-size:11px; letter-spacing:.12em; color:var(--muted); margin-bottom:8px}
  .bell-head b{color:var(--yellow); font-size:14px}
  .bell{position:relative; display:flex; align-items:flex-end; gap:2px; height:96px; padding-top:20px; border-bottom:2px solid rgba(79,227,255,.4)}
  .bell i{flex:1; height:0; background:rgba(79,227,255,.35); transition:height .4s steps(6)}
  .bell i.below{background:rgba(255,79,139,.75)}
  .bell i.you{background:var(--yellow); box-shadow:0 0 10px var(--yellow)}
  .bell .mark{position:absolute; transform:translateX(-50%); font-family:var(--px); font-size:10px; white-space:nowrap}
  .bell .mark.you{top:0; color:var(--yellow)}
  .bell .mark.riv{bottom:-22px; font-size:13px}
  .bell-axis{display:flex; justify-content:space-between; font-family:var(--px); font-size:10px; color:var(--muted); margin-top:22px}

  .mute{position:fixed; top:12px; right:12px; z-index:5; width:42px; height:42px; font-size:18px; background:rgba(10,22,46,.85); border:1px solid rgba(79,227,255,.5)}

  html,body{-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation}
  .wrap{min-height:100dvh; padding-bottom:calc(40px + env(safe-area-inset-bottom))}

  /* ---------- phones ---------- */
  @media (max-width:600px){
    .wrap{padding:4vh 10px calc(20px + env(safe-area-inset-bottom))}
    .logo{font-size:clamp(40px,13vw,60px); text-shadow:-3px 0 0 var(--pink), 3px 0 0 var(--cyan), 0 4px 0 rgba(0,0,0,.35)}
    .sub{font-size:13px; letter-spacing:.35em; margin-top:10px}
    .tagline{font-size:10px; letter-spacing:.06em; padding:6px 10px}
    .frame{padding:18px 14px 16px; margin:16px 0 10px}
    .rival-row{gap:12px} .rival-emoji{font-size:44px}
    .rival-name{font-size:21px}
    .quip{font-size:13px}
    .big{padding:15px 8px; letter-spacing:.18em; font-size:18px}
    .row .grow{display:none}
    .row .mini{flex:1; padding:11px 6px}
    .row .pill{flex-basis:100%; text-align:center}
    .hud{font-size:11px} .hud b{font-size:20px}
    .pips{margin-bottom:12px}
    .timebar{height:14px; gap:2px}
    .q{font-size:19px; margin:10px 0 14px}
    .answer input{font-size:18px; padding:12px}
    .answer button{padding:0 14px; font-size:15px}
    .pass{padding:10px 0 2px}
    .pts{font-size:46px}
    .final{font-size:60px}
    .vsrow .n{width:84px; font-size:11px}
    .stats b{font-size:20px}
    .bd{font-size:12px}
    /* while playing/typing: shrink the title and pin the panel to the top so the keyboard never covers it */
    body.playing .logo{font-size:24px; text-shadow:-2px 0 0 var(--pink), 2px 0 0 var(--cyan)}
    body.pin-top .wrap{padding-top:10px}
    body.pin-top main{margin-top:8px}
    .mute{top:8px; right:8px; width:36px; height:36px; font-size:15px}
  }
  .acct{position:fixed; top:12px; left:12px; z-index:5; width:42px; height:42px; font-size:18px; background:rgba(10,22,46,.85); border:1px solid rgba(79,227,255,.5)}
  .acct.on::after{content:""; position:absolute; top:5px; right:5px; width:8px; height:8px; background:var(--green); box-shadow:0 0 6px var(--green)}

  .stack label{display:block; font-family:var(--px); font-size:11px; letter-spacing:.15em; color:var(--muted); margin-bottom:14px}
  .stack input{display:block; width:100%; margin-top:6px; font-family:var(--mono); font-size:17px; color:#fff; background:#06101f; border:2px solid rgba(79,227,255,.5); padding:12px; outline:none; border-radius:0}
  .stack input:focus{border-color:var(--cyan); box-shadow:0 0 14px rgba(79,227,255,.3)}
  .stack .big{margin-top:6px}
  .big:disabled{opacity:.6; cursor:wait}
  .links{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:14px}
  .link{font-family:var(--px); font-size:11px; letter-spacing:.12em; color:var(--cyan); text-decoration:underline; padding:4px 0}
  .err{color:var(--red); font-size:13px; min-height:18px; margin:-4px 0 6px}
  .note{background:rgba(77,255,154,.1); border:1px solid rgba(77,255,154,.45); color:#c9ffe2; padding:10px 12px; font-size:13px; margin-bottom:14px}

  .cards{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
  .card{background:linear-gradient(180deg,#1b3566,#0f1f3d); border:2px solid var(--yellow); padding:10px 4px 8px; text-align:center; box-shadow:0 0 12px rgba(255,216,79,.25)}
  .card .ce{font-size:30px; line-height:1.1}
  .card .cn{font-family:var(--px); font-size:10px; letter-spacing:.04em; margin-top:5px; line-height:1.2; min-height:24px}
  .card .cs{font-family:var(--px); font-size:9px; color:var(--yellow); margin-top:4px}
  .card.locked{border-color:rgba(255,255,255,.15); background:rgba(255,255,255,.04); box-shadow:none}
  .card.locked .ce{filter:grayscale(1); opacity:.5} .card.locked .cs{color:var(--muted)}
  .badges{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .badge{display:flex; gap:10px; align-items:center; padding:9px 10px; border:1px solid rgba(79,227,255,.35); background:rgba(79,227,255,.06); text-align:left}
  .badge .bi{font-size:26px; line-height:1}
  .badge .bn{font-family:var(--px); font-size:11px; letter-spacing:.08em}
  .badge .bdesc{font-size:11px; color:var(--muted); margin-top:2px}
  .badge.locked{opacity:.45}
  .unlocks .badge{animation:pop .5s cubic-bezier(.2,1.7,.4,1) both; border-color:var(--yellow); background:rgba(255,216,79,.08)}
  .unlocks .badge + .badge{margin-top:8px}
  .unlocks .badge:nth-child(3){animation-delay:.15s} .unlocks .badge:nth-child(4){animation-delay:.3s} .unlocks .badge:nth-child(5){animation-delay:.45s}

  @media (max-width:600px){
    .cards{grid-template-columns:repeat(3,1fr)}
    .badges{grid-template-columns:1fr}
    .acct{top:8px; left:8px; width:36px; height:36px; font-size:15px}
  }
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--cyan); color:#04131f; font-family:var(--px); letter-spacing:.1em; padding:10px 16px; opacity:0; transition:opacity .2s; pointer-events:none}
  .toast.show{opacity:1}
  .fade{animation:fade .3s steps(6)}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="scan"></div>
<div class="wrap">
  <header>
    <h1 class="logo" id="logo">OUTWIT</h1>
    <div class="sub">ARE YOU SMARTER?</div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<button class="mute" id="mute" aria-label="Toggle sound"></button>
<button class="acct" id="acct" aria-label="Account">👤</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ===================== RIVALS + QUESTIONS =====================
   One rival per day, 20 in rotation. Each question:
   [question, displayAnswer, ...otherAcceptedAnswers]
   Answers are checked forgivingly (case, punctuation, "the/a", small typos). */
const RIVALS = [
  {emoji:"🎒", name:"A 5th Grader", target:4600, quip:"Just aced a pop quiz. Feeling dangerous.", qs:[
    ["What is 7 × 8?","56"],
    ["Which planet is closest to the Sun?","Mercury"],
    ["How many sides does a hexagon have?","6"],
    ["What is the capital of Australia?","Canberra"],
    ["Which gas do plants absorb that humans breathe out?","Carbon dioxide","CO2"],
    ["What is the only even prime number?","2"],
    ["What is the past tense of \"swim\"?","Swam"]]},
  {emoji:"🐕", name:"A Golden Retriever", target:2900, quip:"Has never once been wrong about walk time.", qs:[
    ["How many teeth does an adult dog typically have?","42"],
    ["Which sense is strongest in dogs?","Smell","Sense of smell","Scent","Nose"],
    ["Golden Retrievers were first bred in which country?","Scotland"],
    ["Which sweet treat made from cacao is toxic to dogs?","Chocolate"],
    ["What is a group of puppies born together called?","Litter"],
    ["Which dog breed is known as the fastest?","Greyhound"],
    ["Dogs sweat mainly through which part of their body?","Paw pads","Paws","Pads","Feet"]]},
  {emoji:"🏴‍☠️", name:"A Pirate", target:3700, quip:"Knows the seven seas. Can't name them.", qs:[
    ["On a ship, what is the opposite of \"port\"?","Starboard"],
    ["What is the largest ocean on Earth?","Pacific","Pacific Ocean"],
    ["What is the classic skull-and-crossbones pirate flag called?","Jolly Roger"],
    ["What is the front of a ship called?","Bow","Prow"],
    ["Which pirate's real name was Edward Teach?","Blackbeard"],
    ["What unit is used to measure speed at sea?","Knots","Knot"],
    ["Sailors ate citrus fruit to prevent which disease?","Scurvy"]]},
  {emoji:"👵", name:"Your Grandma", target:5300, quip:"Has seen it all. Twice. Brought snacks.", qs:[
    ["How many cups are in a quart?","4"],
    ["What is the main ingredient in guacamole?","Avocado","Avocados"],
    ["Which wedding anniversary is the \"golden\" one?","50th","50","Fiftieth"],
    ["Meringue is made by whipping which part of an egg?","Egg whites","Whites","White","Egg white"],
    ["Which herb is the star of traditional pesto?","Basil"],
    ["In knitting, what stitch is the opposite of \"knit\"?","Purl"],
    ["What kitchen tool is used to flatten dough?","Rolling pin"]]},
  {emoji:"🎱", name:"A Magic 8-Ball", target:2100, quip:"\"Reply hazy. Try again.\"", qs:[
    ["How many possible answers are inside a classic Magic 8-Ball?","20"],
    ["On a standard die, what number is opposite the 1?","6"],
    ["How many squares are on a chessboard?","64"],
    ["How many legs does a spider have?","8"],
    ["In pool, what color is the 8-ball?","Black"],
    ["How many hearts does an octopus have?","3"],
    ["How many sides does an octagon have?","8"]]},
  {emoji:"🐦", name:"A Pigeon", target:2600, quip:"Gets around. Sees everything. Says nothing.", qs:[
    ["Homing pigeons were famously used to carry what?","Messages","Message","Mail","Letters","Notes"],
    ["What is a young pigeon called?","Squab"],
    ["Which bird is the fastest animal on Earth in a dive?","Peregrine falcon","Peregrine","Falcon"],
    ["What is the largest living bird?","Ostrich"],
    ["Which is the only bird that can fly backwards?","Hummingbird","Hummingbirds"],
    ["A group of crows is called a what?","Murder"],
    ["Which London square was famous for its flocks of pigeons?","Trafalgar Square","Trafalgar"]]},
  {emoji:"☕", name:"A Barista", target:3900, quip:"Spelled your name wrong. Still smug.", qs:[
    ["What is espresso diluted with hot water called?","Americano"],
    ["What dessert is espresso poured over ice cream?","Affogato"],
    ["Which country produces the most coffee?","Brazil"],
    ["The two main coffee species are Arabica and what?","Robusta"],
    ["What does \"latte\" mean in Italian?","Milk"],
    ["Espresso + steamed milk + thick foam is a what?","Cappuccino"],
    ["What stimulant in coffee keeps you awake?","Caffeine"]]},
  {emoji:"🚀", name:"An Astronaut", target:5600, quip:"Literally a rocket scientist. No pressure.", qs:[
    ["Who was the first person to walk on the Moon?","Neil Armstrong","Armstrong"],
    ["What is the largest planet in our solar system?","Jupiter"],
    ["Sunlight takes about how many minutes to reach Earth?","8","8 minutes","Eight minutes"],
    ["Which planet is called the Red Planet?","Mars"],
    ["What is the closest star to Earth?","The Sun","Sun"],
    ["Who was the first human in space?","Yuri Gagarin","Gagarin"],
    ["Which planet has the most known moons?","Saturn"]]},
  {emoji:"🧸", name:"A Toddler", target:1700, quip:"Just learned \"why\". Uses it constantly.", qs:[
    ["What color do you get mixing red and blue paint?","Purple","Violet"],
    ["What shape has exactly 3 sides?","Triangle"],
    ["How many days are in a leap year?","366"],
    ["What do caterpillars turn into?","Butterflies","Butterfly","Moths","Moth"],
    ["What letter comes right after Q?","R"],
    ["How many colors are in a traditional rainbow?","7"],
    ["What color do you get mixing yellow and blue paint?","Green"]]},
  {emoji:"🦴", name:"A Caveman", target:1900, quip:"Invented fire. Peaked early.", qs:[
    ["Which \"Age\" came right before the Bronze Age?","Stone Age","Stone"],

const MAX_PTS = 1000, BASE_PTS = 100;      // correct = 100 + up to 900 speed bonus

/* ===================== DATES (local midnight) ===================== */
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayNum = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 864e5) + 1;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmtDate = d => d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}).toUpperCase();
const fmtNum = n => n.toLocaleString();

function mulberry32(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, rnd){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function puzzleFor(date){
  const n = dayNum(date);
  const idx = ((n - 1) % RIVALS.length + RIVALS.length) % RIVALS.length;
  const rival = RIVALS[idx];
  const qs = shuffle(rival.qs, mulberry32(n * 2654435761)).slice(0, QPD)
    .map(([q, ...answers]) => ({ q, answer: answers[0], accepted: answers }));
  return { n, idx, key: keyOf(date), date, rival, qs };
}

/* ===================== ANSWER CHECKING ===================== */
const NUMWORDS = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20};
function norm(s){
  s = s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
       .replace(/&/g, " and ").replace(/(\d)\.(\d)/g, "$1DOT$2").replace(/[^a-z0-9 ]/g, " ")
       .replace(/DOT/gi, ".").replace(/\s+/g, " ").trim()
       .replace(/^(the|a|an) /, "");
  s = s.split(" ").map(w => w in NUMWORDS ? String(NUMWORDS[w]) : w).join(" ");
  return s.replace(/ /g, "");
}
function lev(a, b){
  const d = Array.from({length:a.length+1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function isCorrect(guess, accepted){
  const g = norm(guess); if (!g) return false;
  return accepted.some(a => {
    const t = norm(a);
    if (g === t) return true;
    if (/\d/.test(t)) return false;                              // numbers must be exact
    const allow = t.length >= 8 ? 2 : t.length >= 4 ? 1 : 0;    // forgive small typos
    return lev(g, t) <= allow;
  });
}

/* Combine this device's games with the account's games (keeps the most complete record per day) */
function mergeStores(a, b){
  const out = {};
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])){
    const A = a[k], B = b[k];
    if (!A || !B){ out[k] = A || B; continue; }
    const dA = A.answers.length === QPD, dB = B.answers.length === QPD;
    out[k] = dA !== dB ? (dA ? A : B) : (B.answers.length > A.answers.length ? B : A);
  }
  return out;
}

async function pullAndMerge(){
  if (!sb || !user) return;
  syncState = "syncing";
  try {
    const { data, error } = await sb.from("progress").select("data").eq("user_id", user.id).maybeSingle();
    if (error) throw error;
    saveLocal(mergeStores(load(), (data && data.data) || {}));
    await pushNow();
  } catch (e) { syncState = "error"; console.warn("Sync failed:", e); }
  // refresh whatever is on screen so merged progress shows up
  if (!game && !locked){
    if (document.getElementById("go")) home();
    else if (document.getElementById("logout")) accountView();
  }
}
async function pushNow(){
  if (!sb || !user) return;
  try {
    const { error } = await sb.from("progress").upsert({ user_id: user.id, data: load(), updated_at: new Date().toISOString() });
    if (error) throw error;
    syncState = "synced";
  } catch (e) { syncState = "error"; console.warn("Sync failed:", e); }
}
function queuePush(){ if (!sb || !user) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushNow, 1200); }

/* ===================== STORAGE ===================== */
let memStore = {};
const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return JSON.parse(JSON.stringify(memStore)); } };
const saveLocal = s => { memStore = s; try { localStorage.setItem(STORE, JSON.stringify(s)); } catch {} };
const save = s => { saveLocal(s); queuePush(); };   // also backs up to your account when logged in
const getRec = key => load()[key] || { answers: [] };
const setRec = (key, rec) => { const s = load(); s[key] = rec; save(s); };
const total = rec => rec.answers.reduce((t, a) => t + a.pts, 0);
const done = rec => rec.answers.length === QPD;

function stats(){
  const s = load(); let played = 0, best = 0, sum = 0;
  for (const k in s) if (done(s[k])) { played++; const t = total(s[k]); sum += t; best = Math.max(best, t); }
  let streak = 0, d = new Date();
  if (!(s[keyOf(d)] && done(s[keyOf(d)]))) d = addDays(d, -1);
  while (s[keyOf(d)] && done(s[keyOf(d)])) { streak++; d = addDays(d, -1); }
  return { played, best, avg: played ? Math.round(sum / played) : 0, streak };
}

function rankFor(score){
  const r = score / (QPD * MAX_PTS);
  if (r >= .85) return "CERTIFIED GENIUS";
  if (r >= .70) return "BIG BRAIN ENERGY";
  if (r >= .50) return "PRETTY SHARP";
  if (r >= .30) return "GETTING THERE";
  if (r > 0)    return "ROUGH DAY";
  return "BRAIN OFFLINE";
}

function hex(c){ const n = parseInt(c.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function mix(a, b, t){ const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; }
function shade(c, k){ const A = hex(c); return `rgb(${A.map(v => Math.max(0, Math.min(255, Math.round(v * k)))).join(",")})`; }

/* Turn an emoji into a crisp little pixel sprite */
function sprite(emoji, size){
  const key = emoji + size; if (sprites[key]) return sprites[key];
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d");
  x.font = `${Math.round(size * .86)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(emoji, size / 2, size / 2 + size * .06);
  try { const d = x.getImageData(0, 0, size, size); for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 100 ? 255 : 0; x.putImageData(d, 0, 0); } catch {}
  return sprites[key] = c;
}

}

function emit(v, x, h){
  const R = Math.random, P = o => { const p = Object.assign({x, h, vx:0, vh:0, life:20}, o); p.max = p.life; anim.parts.push(p); };
  switch (v.trail){
    case "flame":   P({type:"flame", vx:(R()-.5)*.5, vh:-.9-R()*.6, life:12+R()*8|0}); break;
    case "smoke":   P({type:"smoke", vx:(R()-.5)*.3, vh:-.35, life:26}); break;
    case "sparkle": P({type:"sparkle", x:x+(R()-.5)*12, h:h+R()*8, vx:(R()-.5)*.4, vh:-.25-R()*.3, life:20, color:v.colors[R()*v.colors.length|0]}); break;
    case "feather": P({type:"feather", x:x+(R()-.5)*8, vx:(R()-.5)*.5, vh:-.3, life:44}); break;
    case "bubbles": P({type:"bubble", x:x+(R()-.5)*10, vx:(R()-.5)*.2, vh:-.45, life:30}); break;
  }
}

function update(t, hz){
  const v = VEHICLES[sceneIdx];
  const target = anim.mode === "flight" ? altFor(anim.score) : 0;
  const diff = target - anim.alt;
  anim.alt = Math.abs(diff) < .3 ? target : anim.alt + diff * .06;
  // where the ride sits on screen: lower on phones while the question panel is pinned to the top
  const anchor = document.body.classList.contains("pin-top") && innerWidth <= 600 ? .78 : .34;
  const camT = anim.mode === "flight" ? Math.max(0, anim.alt + 16 - hz + H * anchor) : 0;
  anim.cam += (camT - anim.cam) * .08;
  anim.flame *= .93; anim.shake *= .85;

  // trail particles
  const rising = diff > 1.5;
  const rate = rising ? 2 : anim.mode === "flight" ? .35 : .05;
  for (let n = rate; n > 0; n--) if (Math.random() < n) emit(v, W * .5, anim.alt + 2);
  if (anim.flame > .3 && v.trail === "flame") emit(v, W * .5, anim.alt + 2);

  // confetti when you pass the rival's flag
  if (anim.celebrate && !anim.celebrated && anim.flag != null && anim.alt >= altFor(anim.flag)){
    anim.celebrated = true;
    const cols = ["#ff4f8b","#4fe3ff","#ffd84f","#4dff9a","#ffffff"];
    for (let i = 0; i < 80; i++) anim.parts.push({type:"confetti", x:Math.random()*W, h:altFor(anim.flag) + Math.random()*10,
      vx:(Math.random()-.5)*1.4, vh:.6 + Math.random()*1.6, life:60, max:60, color:cols[i % cols.length]});
  }
  for (const p of anim.parts){
    p.x += p.vx; p.h += p.vh; p.life--;
    if (p.type === "confetti") p.vh -= .06;
    if (p.type === "feather") p.vx = Math.sin(p.life * .3) * .4;
  }
  anim.parts = anim.parts.filter(p => p.life > 0).slice(-400);
}

function drawScene(t){
  if (!scene) return;
  const s = scene, hz = Math.round(H * (s.horizon || .6)), ALT = altRange();
  const key = `${W}x${H}:${sceneIdx}`;
  if (key !== skyKey){ skyKey = key; buildSky(hz); }
  update(t, hz);
  const cam = Math.round(anim.cam), Y = h => Math.round(hz - h + cam);   // world height -> screen y

  // sky: scene colors near the ground, fading to deep space as you climb
  const bandH = Math.max(2, Math.round(hz / 12));
  for (let y = 0; y < H; y += 2){
    const h = Math.floor((hz - y + cam) / bandH) * bandH;
    g.fillStyle = h <= hz ? mix(s.sky[1], s.sky[0], Math.max(0, h) / hz) : mix(s.sky[0], SPACE, Math.min(1, (h - hz) / (ALT * .7)));
    g.fillRect(0, y, W, 2);
  }
  for (const st of skyStars){
    const y = Y(st.h); if (y < 0 || y > H) continue;
    const a = s.night ? 1 : Math.max(0, Math.min(1, (st.h - hz) / (ALT * .35)));
    if (a < .05) continue;
    g.fillStyle = `rgba(255,255,255,${a * (Math.sin(t * 2 + st.p) > .5 ? 1 : .45)})`; g.fillRect(st.x, y, 1, 1);
  }
  if (!s.night) for (const c of skyClouds){
    const y = Y(c.h); if (y < -12 || y > H) continue;
    cloud(Math.round(((c.x + t * c.sp) % (W + c.w * 2)) - c.w), y, c.w);
  }

  // the ground world (scrolls down as you rise)
  g.save(); g.translate(0, cam);
  const bx = Math.round(W * .74), by = Math.round(hz * .28);
  if (s.sun) disc(bx, by, 9, s.sun);
  if (s.moon){ disc(bx, by, 8, "#f4f1d0"); disc(bx + 4, by - 2, 7, mix(s.sky[0], s.sky[1], .25)); }
  ground(s, hz, t);
  for (const [e, px, size, dy = 0] of s.props){
    const bob = dy > 0 ? Math.round(Math.sin(t * 1.5 + px * 9) * 1.5) : dy < 0 ? Math.round(Math.sin(t + px * 5) * 2) : 0;
    g.drawImage(sprite(e, size), Math.round(W * px - size / 2), hz - size + 1 + dy + bob);
  }
  const rs = W < 300 ? 24 : 30, rb = Math.round(Math.sin(t * 2.2) * (s.ground === "water" ? 2 : 1));
  g.drawImage(sprite(sceneRival, rs), Math.round(W * .3 - rs / 2), hz - rs + 2 + rb);
  g.restore();

  // rival's flag line
  if (anim.flag != null){
    const fy = Y(altFor(anim.flag));
    if (fy > -10 && fy < H + 10){
      g.fillStyle = "rgba(255,79,139,.9)"; for (let x = 0; x < W; x += 6) g.fillRect(x, fy, 3, 1);
      g.fillStyle = "#e9f6ff"; g.fillRect(6, fy - 12, 1, 12);
      g.fillStyle = "#ff4f8b"; for (let i = 0; i < 5; i++) g.fillRect(7, fy - 12 + i, 6 - i, 1), g.fillRect(7, fy - 12 + 9 - i, 6 - i, 1);
      g.drawImage(sprite(sceneRival, 12), 15, fy - 13);
      g.font = "8px Silkscreen, monospace"; g.textBaseline = "bottom"; g.textAlign = "right";
      g.fillStyle = "rgba(0,0,0,.5)"; g.fillText(fmtNum(anim.flag), W - 3, fy - 1);
      g.fillStyle = "#ffffff"; g.fillText(fmtNum(anim.flag), W - 4, fy - 2);
    }
  }

  // the ride
  const v = VEHICLES[sceneIdx];
  const vx = Math.round(W * .5 + Math.sin(t * 1.3) * (anim.mode === "flight" ? 3 : 0) + (Math.random() - .5) * anim.shake * 6);
  const vy = Y(anim.alt);
  if ((v.trail === "string" || v.trail === "vine") && anim.alt > 2) tether(v.trail, vx, vy, Math.round(W * .44), Y(0), t);
  for (const p of anim.parts) drawPart(p, Y(p.h));
  if (v.balloon) drawBalloon(vx, vy, v.balloon, t);
  else { const vs = W < 300 ? 16 : 20; g.drawImage(sprite(v.emoji, vs), vx - vs / 2, vy - vs + 1); }
}

function tether(kind, x1, y1, x2, y2, t){
  const n = Math.max(2, Math.ceil(Math.abs(y2 - y1) / 2));
  for (let i = 0; i <= n; i++){
    const k = i / n, x = Math.round(x1 + (x2 - x1) * k + Math.sin(i * .35 + t * 3) * (kind === "vine" ? 1 : 2) * (1 - k)), y = Math.round(y1 + (y2 - y1) * k);
    if (y < -4 || y > H + 4) continue;
    if (kind === "vine"){
      g.fillStyle = "#2f8f3e"; g.fillRect(x - 1, y, 2, 2);
      if (i % 6 === 0){ g.fillStyle = "#6ee06e"; g.fillRect((i / 6) % 2 ? x + 1 : x - 4, y, 3, 2); }
    } else { g.fillStyle = "rgba(255,255,255,.85)"; g.fillRect(x, y, 1, 1); }
  }
}

function drawPart(p, y){
  const k = p.life / p.max; if (y < -6 || y > H + 6) return;
  const x = Math.round(p.x);
  switch (p.type){
    case "flame":   g.fillStyle = k > .66 ? "#fff3a0" : k > .33 ? "#ffb627" : "#ff5a3d"; g.fillRect(x - 1, y, 2, 2); break;
    case "smoke":  { const s = Math.round(1 + (1 - k) * 4); g.fillStyle = `rgba(240,240,255,${k * .7})`; g.fillRect(x - (s >> 1), y - (s >> 1), s, s); break; }
    case "sparkle": if (p.life % 4 < 2){ g.fillStyle = p.color; g.fillRect(x, y, 1, 1); if (k > .6){ g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); } } break;
    case "feather": g.fillStyle = `rgba(255,255,255,${k})`; g.fillRect(x, y, 2, 1); break;
    case "bubble":  g.fillStyle = `rgba(210,245,255,${k})`; g.fillRect(x - 1, y, 1, 1); g.fillRect(x + 1, y, 1, 1); g.fillRect(x, y - 1, 1, 1); g.fillRect(x, y + 1, 1, 1); break;
    case "confetti": g.fillStyle = p.color; g.fillRect(x, y, 2, 2); break;
    case "dust":    g.fillStyle = `rgba(210,200,180,${k * .8})`; g.fillRect(x - 1, y - 1, 3, 2); break;
  }
}

function drawBalloon(x, y, cols, t){
  const r = W < 300 ? 8 : 10, cy = y - 4 - 5 - r;          // basket 4, ropes 5
  const band = r / 2.5;
  for (let dy = -r; dy <= r; dy++){
    const w = Math.round(Math.sqrt(r * r - dy * dy));
    for (let dx = -w; dx < w; dx++){ g.fillStyle = Math.floor((dx + r) / band) % 2 ? cols[1] : cols[0]; g.fillRect(x + dx, cy + dy, 1, 1); }
  }
  for (let i = 1; i <= 3; i++){                              // tapered bottom
    const w = Math.round(r * .7 - i * 1.4);
    for (let dx = -w; dx < w; dx++){ g.fillStyle = Math.floor((dx + r) / band) % 2 ? cols[1] : cols[0]; g.fillRect(x + dx, cy + r + i, 1, 1); }
  }
  g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(x - Math.round(r * .55), cy - Math.round(r * .4), 1, Math.round(r * .7));
  g.fillStyle = "#3a2a1a"; g.fillRect(x - 3, y - 9, 1, 5); g.fillRect(x + 2, y - 9, 1, 5);
  if (anim.flame > .15 || anim.mode === "flight"){
    g.fillStyle = anim.flame > .15 ? "#ffd84f" : "#ff8a3d"; g.fillRect(x - 1, y - 8, 2, 2 + ((t * 20 | 0) % 2) + (anim.flame > .5 ? 2 : 0));
  }
  g.fillStyle = "#8b5a2b"; g.fillRect(x - 3, y - 4, 6, 4);
  g.fillStyle = "#5e3a1a"; g.fillRect(x - 3, y - 2, 6, 1);
}

function disc(cx, cy, r, col){ g.fillStyle = col; for (let y = -r; y <= r; y++){ const w = Math.round(Math.sqrt(r * r - y * y)); g.fillRect(cx - w, cy + y, w * 2, 1); } }
function cloud(x, y, w){
  g.fillStyle = "rgba(255,255,255,.92)";
  g.fillRect(x, y + 4, w, 4); g.fillRect(x + 3, y + 1, w * .45 | 0, 4); g.fillRect(x + (w * .45 | 0), y - 1, w * .35 | 0, 6);
  g.fillStyle = "rgba(200,220,240,.8)"; g.fillRect(x + 1, y + 8, w - 2, 1);
}

function ground(s, hz, t){
  const [a, b] = s.gc, gh = H - hz, rnd = mulberry32(7), bands = 8;
  for (let i = 0; i < bands; i++){ g.fillStyle = mix(a, b, i / (bands - 1)); g.fillRect(0, hz + Math.floor(gh * i / bands), W, Math.ceil(gh / bands) + 1); }
  switch (s.ground){
    case "water":
      g.fillStyle = shade(a, 1.35);
      for (let x = 0; x < W; x++){ const y = hz + Math.round(Math.sin(x * .18 + t * 2) * 1); g.fillRect(x, y, 1, 1); }
      for (let i = 0; i < 40; i++){
        const y = hz + 4 + (rnd() * gh * .7 | 0), x = ((rnd() * W + t * (3 + rnd() * 4)) % W) | 0;
        g.fillStyle = `rgba(255,255,255,${.12 + .25 * (1 - (y - hz) / gh)})`; g.fillRect(x, y, 2 + (rnd() * 4 | 0), 1);
      }
      break;
    case "grass":
      g.fillStyle = shade(a, 1.18); g.fillRect(0, hz, W, 2);
      for (let i = 0; i < 70; i++){ const x = rnd() * W | 0, y = hz + 3 + (rnd() * gh | 0); g.fillStyle = shade(a, .8); g.fillRect(x, y, 1, 2); g.fillRect(x + 2, y + 1, 1, 1); }
      break;
    case "sand": case "rock": case "felt":
      g.fillStyle = shade(a, 1.12); g.fillRect(0, hz, W, 1);
      for (let i = 0; i < 90; i++){ g.fillStyle = shade(a, rnd() > .5 ? .82 : 1.1); g.fillRect(rnd() * W | 0, hz + 2 + (rnd() * gh | 0), s.ground === "rock" ? 2 : 1, 1); }
      break;
    case "moon":
      for (let i = 0; i < 14; i++){ const x = rnd() * W | 0, y = hz + 4 + (rnd() * gh * .8 | 0), r = 2 + (rnd() * 4 | 0);
        g.fillStyle = shade(a, .78); g.fillRect(x - r, y, r * 2, 2); g.fillStyle = shade(a, 1.1); g.fillRect(x - r, y + 2, r * 2, 1); }
      break;
    case "floor": case "wood":
      for (let y = hz + 5, row = 0; y < H; y += 6, row++){
        g.fillStyle = shade(a, .75); g.fillRect(0, y, W, 1);
        if (s.ground === "wood") for (let x = (row % 2) * 20; x < W; x += 40) g.fillRect(x, y - 5, 1, 5);
      }
      break;
    case "tile":
      for (let y = hz, r = 0; y < H; y += 8, r++) for (let x = (r % 2) * 8; x < W; x += 16){ g.fillStyle = shade(a, .82); g.fillRect(x, y, 8, 8); }
      break;
    case "roof":
      for (let y = hz + 3, r = 0; y < H; y += 5, r++){ g.fillStyle = shade(a, .7); g.fillRect(0, y, W, 1);
        for (let x = (r % 2) * 5; x < W; x += 10) g.fillRect(x, y - 4, 1, 4); }
      break;
  }
}
let lastFrame = 0;
function loop(now){
  if (now - lastFrame > 33){ lastFrame = now; drawScene(now / 1000); }   // ~30fps
  requestAnimationFrame(loop);
}

/* ===================== PASSWORD GATE =====================
   The password is stored only as a hash. To change it, run in the browser console:
   pwHash("outwit:yournewpassword")  and paste the result into PW_HASH. */
const PW_HASH = "1046iwd", UNLOCK_KEY = "outwit-unlocked";
const pwHash = s => { let x = 2166136261; for (const c of s){ x ^= c.charCodeAt(0); x = Math.imul(x, 16777619) >>> 0; } return x.toString(36); };
let locked = true;
try { locked = localStorage.getItem(UNLOCK_KEY) !== PW_HASH; } catch {}

function gate(){
  setScene(puzzleFor(new Date()));
  render(`
    <div class="frame center">
      <div class="tab pink">MEMBERS ONLY</div>
      <div style="font-size:44px; margin:4px 0 6px">🔒</div>
      <div class="rival-name">ENTER PASSWORD</div>
      <div class="quip" style="margin-bottom:16px">Say the secret word to start outwitting.</div>
      <form class="answer" id="pwform" autocomplete="off">
        <input id="pw" type="password" placeholder="PASSWORD" autocapitalize="off" spellcheck="false" />
        <button type="submit">ENTER</button>
      </form>
      <div class="tries" id="pwmsg"></div>
    </div>`, false, true);
  fly(0, false);
  const input = document.getElementById("pw");
  input.focus();
  document.getElementById("pwform").onsubmit = e => {
    e.preventDefault();
    if (pwHash("outwit:" + input.value.trim().toLowerCase()) === PW_HASH){
      locked = false;
      try { localStorage.setItem(UNLOCK_KEY, PW_HASH); } catch {}
      SFX.correct(); home();
    } else {
      input.value = ""; input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake"); SFX.wrong();
      document.getElementById("pwmsg").innerHTML = `<span class="nope">WRONG PASSWORD — TRY AGAIN</span>`;
    }
  };
}

function archive(){
  let rows = "";
  for (let i = 1; i <= ARCHIVE_DAYS; i++){
    const ap = puzzleFor(addDays(new Date(), -i)), r = getRec(ap.key), f = done(r);
    rows += `<div class="list-row" data-i="${i}"><div class="e">${ap.rival.emoji}</div>
      <div class="t"><div>${ap.rival.name.toUpperCase()}</div><div class="muted small">#${ap.n} · ${fmtDate(ap.date)}</div></div>
      <div class="r" style="color:${f ? "var(--yellow)" : "var(--cyan)"}">${f ? fmtNum(total(r)) : r.answers.length ? "RESUME ›" : "PLAY ›"}</div></div>`;
  }
  fly(0, false);
  render(`<div class="frame"><div class="tab">ARCHIVE · LAST ${ARCHIVE_DAYS} DAYS</div>${rows}</div>
          <button class="big" id="back">◀ BACK</button>`);
  document.querySelectorAll(".list-row").forEach(row => row.onclick = () => {
    const ap = puzzleFor(addDays(new Date(), -row.dataset.i));
    setScene(ap);
    done(getRec(ap.key)) ? results(ap) : start(ap);

function start(p){
  game = { p, i: getRec(p.key).answers.length, timerId: null };
  setScene(p);
  fly(total(getRec(p.key)), true, p.rival.target);
  SFX.start(); setTimeout(SFX.whoosh, 250);
  question();
}

function hud(p, rec){
  const pips = p.qs.map((_, i) => { const a = rec.answers[i];
    return `<div class="pip ${a ? (a.ok ? "ok" : "no") : i === game.i ? "cur" : ""}"></div>`; }).join("");
  return `<div class="hud"><div>${p.rival.emoji} VS ${p.rival.name.replace(/^(A|An) /, "").toUpperCase()}<b>Q${Math.min(game.i + 1, QPD)}/${QPD}</b></div>
      <div style="text-align:right">SCORE<b>${fmtNum(total(rec))}</b></div></div><div class="pips">${pips}</div>`;
}

const SEGS = 30;
function question(){
  const { p } = game, rec = getRec(p.key), item = p.qs[game.i];
  if (!rec.cur || rec.cur.i !== game.i) { rec.cur = { i: game.i, startedAt: Date.now() }; setRec(p.key, rec); }
  render(`
    <div class="frame">
      <div class="tab pink">QUESTION ${game.i + 1}</div>
      ${hud(p, rec)}
      <div class="timebar" id="bar">${"<i></i>".repeat(SEGS)}</div>
      <div class="secs" id="secs"></div>
      <div class="q">${item.q}</div>
      <form class="answer" id="form" autocomplete="off">
        <input id="guess" placeholder="TYPE YOUR ANSWER" autocapitalize="off" spellcheck="false" />
        <button type="submit">GO</button>
      </form>
      <div class="tries" id="tries"></div>
      <button class="pass" id="pass">PASS ›</button>
    </div>`, true);

  const input = document.getElementById("guess"), triesEl = document.getElementById("tries");
  const showTries = () => {
    const w = getRec(p.key).cur.wrong || [];
    triesEl.innerHTML = w.length ? `<span class="nope">${w.length === 1 ? "NOPE — KEEP GUESSING!" : `NOPE ×${w.length} — KEEP GOING!`}</span>` +
      w.map(x => `<span class="tried">✗ ${esc(x)}</span>`).join("") : "";
  };
  const shake = () => { input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake"); };
  showTries();
  input.focus();
  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return shake();
    if (isCorrect(val, item.accepted)) return submit(val);
    // Wrong: remember it, clear the box, and keep the clock running
    const r = getRec(p.key);
    r.cur.wrong = [...(r.cur.wrong || []), val];
    setRec(p.key, r);
    input.value = ""; shake(); showTries(); input.focus(); wobble(); SFX.wrong();
  };
  document.getElementById("pass").onclick = () => submit("");

  const bar = document.getElementById("bar"), segs = [...bar.children], secs = document.getElementById("secs");
  const startedAt = rec.cur.startedAt;
  stopTimer();
  let lastSec = -1;
  const step = () => {
    const left = Math.max(0, SECONDS - (Date.now() - startedAt) / 1000);
    const on = Math.ceil(left / SECONDS * SEGS);
    segs.forEach((s, i) => s.classList.toggle("off", i >= on));
    bar.className = "timebar" + (left <= 10 ? " low" : left <= 20 ? " mid" : "");
    secs.textContent = `${Math.ceil(left)}S LEFT`;
    secs.classList.toggle("low", left <= 10);
    const sec = Math.ceil(left);
    if (left <= 10 && left > 0 && sec !== lastSec){ lastSec = sec; SFX.tick(); }
    if (left <= 0) submit(null);
  };
  game.timerId = setInterval(step, 100); step();
}

function stopTimer(){ if (game && game.timerId){ clearInterval(game.timerId); game.timerId = null; } }

/* guess: typed text, "" = passed, null = time ran out */
function submit(guess){
  stopTimer();
  const { p } = game, rec = getRec(p.key), item = p.qs[game.i];
  if (rec.answers.length > game.i) return;
  const left = Math.max(0, SECONDS - (Date.now() - rec.cur.startedAt) / 1000);
  const ok = guess ? isCorrect(guess, item.accepted) : false;
  const pts = ok ? Math.round(BASE_PTS + (MAX_PTS - BASE_PTS) * left / SECONDS) : 0;
  const tries = (rec.cur && rec.cur.wrong) || [];
  const how = ok ? "correct" : guess === "" ? "passed" : "timeout";
  rec.answers.push({ ok, pts, how, guess: tries.join(", "), wrong: tries.length, time: Math.round(SECONDS - left) });
  if (done(rec) && p.key !== keyOf(new Date())) rec.archive = true;
  delete rec.cur; setRec(p.key, rec);
  if (ok){ fly(total(rec), true, p.rival.target); boost(); SFX.correct(); setTimeout(SFX.whoosh, 120); }
  else { wobble(); how === "passed" ? SFX.pass() : SFX.timeup(); }

  const last = game.i === QPD - 1;
  render(`
    <div class="frame center">
      <div class="tab ${ok ? "" : "pink"}">QUESTION ${game.i + 1}</div>
      ${hud(p, rec)}
      <div class="verdict" style="color:${ok ? "var(--green)" : "var(--red)"}">
        ${ok ? (tries.length ? `GOT IT!` : "CORRECT!") : how === "passed" ? "PASSED" : "TIME'S UP!"}</div>
      <div class="pts">+${fmtNum(pts)}</div>
      ${ok ? `<div class="muted small">${Math.round(SECONDS - left)}S · SPEED BONUS +${fmtNum(pts - BASE_PTS)}</div>` : ""}
      <div class="ans">ANSWER: <b>${item.answer}</b></div>
      ${tries.length ? `<div class="muted small" style="margin-top:4px">${ok ? `After ${tries.length} wrong ${tries.length === 1 ? "guess" : "guesses"}: ` : "Your guesses: "}${esc(tries.join(", "))}</div>` : ""}
    </div>
    <button class="big" id="next">${last ? "▶ FINAL SCORE ◀" : "▼ NEXT QUESTION ▼"}</button>`, true);
  const next = document.getElementById("next");
  next.focus();
  next.onclick = () => { game.i++; last ? results(p) : question(); };
}

const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function results(p){
  stopTimer(); game = null; setScene(p);
  const rec = getRec(p.key), score = total(rec), right = rec.answers.filter(a => a.ok).length;
  const max = QPD * MAX_PTS, rival = p.rival.target, isToday = p.key === keyOf(new Date());
  fly(score, true, rival); celebrateIf(score > rival);
  setTimeout(() => SFX.final(score > rival), 900);
  const bell = bellCurve(p, score);
  const fresh = newUnlocks();
  if (fresh.length) setTimeout(SFX.unlock, 2100);
  const rname = p.rival.name.replace(/^(A|An) /, "");
  const line = score > rival ? `You outwitted ${p.rival.name.toLowerCase()}.` : score === rival ? `Dead even with ${p.rival.name.toLowerCase()}.` : `${p.rival.name} scored higher today.`;

  render(`
    <div class="frame center">
      <div class="tab">FINAL SCORE · #${p.n}</div>
      <div class="final" id="final">0</div>
      <div class="muted small" style="letter-spacing:.12em">OUT OF ${fmtNum(max)} · ${right}/${QPD} CORRECT</div>
      <div class="rank">${rankFor(score)}</div>
      <div class="muted">${line}</div>
      <div class="vs">
        <div class="vsrow"><span class="n">YOU</span><div class="bar"><i id="b1" style="background:var(--pink)"></i></div><span class="v">${fmtNum(score)}</span></div>
        <div class="vsrow"><span class="n">${p.rival.emoji} ${rname.toUpperCase()}</span><div class="bar"><i id="b2" style="background:var(--cyan)"></i></div><span class="v">${fmtNum(rival)}</span></div>
      </div>
      ${bell.html}
    </div>
    ${fresh.length ? `<div class="frame unlocks"><div class="tab pink">NEW UNLOCKS!</div>
      ${fresh.map(u => `<div class="badge"><div class="bi">${u.icon}</div><div><div class="bn">${u.name.toUpperCase()}</div><div class="bdesc">${u.desc}</div></div></div>`).join("")}
      <button class="link" id="seeTrophies" style="margin-top:10px">SEE TROPHY ROOM ›</button></div>` : ""}
    <button class="big pink" id="share">SHARE SCORE</button>
    <div class="row">
      <button class="mini" id="back">◀ HOME</button><span class="grow"></span>
      ${isToday ? `<span class="pill">NEXT RIVAL IN <span class="cd" id="cd"></span></span>` : ""}
    </div>
    <div class="frame"><div class="tab">BREAKDOWN</div>
      ${rec.answers.map((a, i) => `<div class="bd"><div>${a.ok ? "✅" : "❌"}</div>
        <div class="q2"><div>${p.qs[i].q}</div><div>${p.qs[i].answer}${a.ok ? ` · ${a.time}s` : a.how === "passed" ? " · passed" : " · time ran out"}${a.guess ? ` · tried “${esc(a.guess)}”` : ""}</div></div>
        <div class="p">${a.pts ? "+" + fmtNum(a.pts) : "0"}</div></div>`).join("")}
    </div>`);

  const el = document.getElementById("final"), t0 = performance.now();
  const countUp = now => { const k = Math.min(1, (now - t0) / 1200), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmtNum(Math.round(score * e)); if (k < 1) requestAnimationFrame(countUp); };
  requestAnimationFrame(countUp);
  setTimeout(() => {
    bell.grow();
    document.getElementById("b1").style.width = (score / max * 100) + "%";
    document.getElementById("b2").style.width = (rival / max * 100) + "%";
  }, 60);

  document.getElementById("back").onclick = home;
  const seeT = document.getElementById("seeTrophies"); if (seeT) seeT.onclick = trophies;
  document.getElementById("share").onclick = () => {
    const grid = rec.answers.map(a => !a.ok ? "🟥" : a.pts >= 700 ? "🟩" : "🟨").join("");
    const txt = `OUTWIT #${p.n} ${p.rival.emoji} vs ${p.rival.name}\n${fmtNum(score)} pts (${right}/${QPD}) — ${rankFor(score)}\n${grid}`;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => toast("COPIED!")).catch(() => toast("COPY BLOCKED — SCREENSHOT IT!"));
  };
  tick();
}

function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }

/* ===================== TROPHY ROOM =====================
   Rival cards: beat a rival's score to collect their card (20 to collect).
   Accolades: badges for milestones. Both are worked out from your saved games,
   so they follow you to any device once you're logged in. */
const BADGES = [
  {id:"first",   icon:"🎈", name:"First Flight",          desc:"Finish your first game"},
  {id:"win",     icon:"🧠", name:"Outwitted!",            desc:"Beat a rival's score"},
  {id:"space",   icon:"🌌", name:"Space Cadet",           desc:"Score 6,000+ in one day"},
  {id:"perfect", icon:"💯", name:"Flawless",              desc:"Get all 7 right"},
  {id:"sharp",   icon:"🎯", name:"Sharpshooter",          desc:"7/7 without a single wrong guess"},
  {id:"speed",   icon:"⚡", name:"Speed Demon",           desc:"Answer right within 3 seconds"},
  {id:"clutch",  icon:"⏱️", name:"Clutch",                desc:"Answer right with 3 seconds or less left"},
  {id:"grit",    icon:"🪨", name:"Never Give Up",         desc:"Get it right after 3+ wrong guesses"},
  {id:"streak3", icon:"🔥", name:"On a Roll",             desc:"Play 3 days in a row"},
  {id:"streak7", icon:"📅", name:"Week Warrior",          desc:"Play 7 days in a row"},
  {id:"travel",  icon:"🕰️", name:"Time Traveler",         desc:"Finish 5 past days from the archive"},
  {id:"half",    icon:"🃏", name:"Half the Deck",         desc:"Collect 10 rival cards"},
  {id:"all",     icon:"👑", name:"Smarter Than Everyone", desc:"Collect all 20 rival cards"},
];
const wrongCount = a => a.wrong != null ? a.wrong : a.guess ? a.guess.split(", ").length : 0;
const shortName = r => r.name.replace(/^(A|An) /, "");

function awards(){
  const s = load(), cards = {}, got = new Set(), days = [];
  let archived = 0;
  for (const k in s){
    const rec = s[k]; if (!rec || !done(rec)) continue;
    const [y, m, d] = k.split("-").map(Number), p = puzzleFor(new Date(y, m - 1, d));
    const sc = total(rec), right = rec.answers.filter(a => a.ok).length;
    days.push(p.n); got.add("first");
    const c = cards[p.idx] = cards[p.idx] || { wins:0, best:0 };
    c.best = Math.max(c.best, sc);
    if (sc > p.rival.target){ c.wins++; got.add("win"); }
    if (sc >= 6000) got.add("space");
    if (right === QPD){ got.add("perfect"); if (rec.answers.every(a => !wrongCount(a))) got.add("sharp"); }
    for (const a of rec.answers){
      if (!a.ok) continue;
      if (a.time <= 3) got.add("speed");
      if (SECONDS - a.time <= 3) got.add("clutch");
      if (wrongCount(a) >= 3) got.add("grit");
    }
    if (rec.archive) archived++;
  }
  // longest run of consecutive days played
  days.sort((a, b) => a - b);
  let run = 0, best = 0;
  days.forEach((n, i) => { run = i && n === days[i - 1] + 1 ? run + 1 : 1; best = Math.max(best, run); });
  if (best >= 3) got.add("streak3");
  if (best >= 7) got.add("streak7");
  if (archived >= 5) got.add("travel");
  const owned = Object.keys(cards).filter(i => cards[i].wins).map(Number);
  if (owned.length >= 10) got.add("half");
  if (owned.length >= RIVALS.length) got.add("all");
  return { cards, owned, got };
}

/* What did this game unlock that the player hasn't seen yet? */
let memSeen = null;   // fallback if the browser blocks storage
function newUnlocks(){
  const aw = awards();
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem("outwit-seen")); } catch {}
  seen = seen || memSeen || { b:[], c:[] };
  const nc = aw.owned.filter(i => !seen.c.includes(i));
  const nb = BADGES.filter(b => aw.got.has(b.id) && !seen.b.includes(b.id));
  memSeen = { b:[...aw.got], c:aw.owned };
  try { localStorage.setItem("outwit-seen", JSON.stringify(memSeen)); } catch {}
  return [...nc.map(i => ({ icon:RIVALS[i].emoji, name:`${shortName(RIVALS[i])} card`, desc:"Added to your rival cards" })), ...nb];
}

function trophies(){
  stopTimer(); game = null; fly(0, false);
  const aw = awards();
  const cards = RIVALS.map((r, i) => {
    const c = aw.cards[i], have = c && c.wins;
    return `<div class="card ${have ? "" : "locked"}">
      <div class="ce">${have ? r.emoji : "❔"}</div>
      <div class="cn">${have ? shortName(r).toUpperCase() : "???"}</div>
      <div class="cs">${have ? `BEST ${fmtNum(c.best)}${c.wins > 1 ? ` · ×${c.wins}` : ""}` : `BEAT ${fmtNum(r.target)}`}</div></div>`;
  }).join("");
  const badges = BADGES.map(b => { const has = aw.got.has(b.id);
    return `<div class="badge ${has ? "" : "locked"}"><div class="bi">${has ? b.icon : "🔒"}</div>
      <div><div class="bn">${b.name.toUpperCase()}</div><div class="bdesc">${b.desc}</div></div></div>`; }).join("");
  render(`
    <div class="frame"><div class="tab">RIVAL CARDS · ${aw.owned.length}/${RIVALS.length}</div>
      <div class="muted small" style="margin-bottom:10px">Beat a rival's score to add their card. Rivals come back every ${RIVALS.length} days, and past days are in the archive.</div>
      <div class="cards">${cards}</div></div>

    <button class="big" id="back">◀ BACK</button>`);
  document.getElementById("back").onclick = () => locked ? gate() : home();
}

/* Runs an async form action with a busy button and friendly errors */
function onForm(fn){
  const f = document.getElementById("f"), sub = document.getElementById("sub"), err = document.getElementById("err");
  f.onsubmit = async e => {
    e.preventDefault();
    err.textContent = ""; sub.disabled = true;
    const label = sub.textContent; sub.textContent = "· · ·";
    try { await fn(); }
    catch (x){ if (document.body.contains(err)) err.textContent = (x && x.message) || "Something went wrong. Try again."; SFX.wrong(); }
    if (document.body.contains(sub)){ sub.disabled = false; sub.textContent = label; }
  };
}

/* ===================== SOUND (8-bit, generated in code — no audio files) ===================== */
let actx = null, muted = false;
try { muted = localStorage.getItem("outwit-muted") === "1"; } catch {}
function beep(freq, dur, type = "square", vol = .08, slideTo = null, delay = 0){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), gn = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(gn).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch {}
}
const SFX = {
  click:   () => beep(660, .05, "square", .035),
  start:   () => [392, 523, 659, 784].forEach((f, i) => beep(f, .12, "square", .06, null, i * .09)),
  whoosh:  () => beep(180, .55, "triangle", .05, 900),
  correct: () => { beep(784, .08, "square", .07); beep(1175, .18, "square", .07, null, .08); },
  wrong:   () => beep(220, .2, "sawtooth", .05, 130),
  pass:    () => beep(440, .14, "triangle", .06, 300),
  tick:    () => beep(1200, .035, "square", .03),
  timeup:  () => beep(330, .5, "triangle", .09, 100),
  unlock:  () => [659, 880, 1175, 1568].forEach((f, i) => beep(f, .1, "square", .06, null, i * .07)),
  final:   win => (win ? [523, 659, 784, 1047, 1319] : [392, 349, 330, 262]).forEach((f, i) => beep(f, .2, "square", .06, null, i * .13)),
};
const muteBtn = document.getElementById("mute");
const showMute = () => muteBtn.textContent = muted ? "🔇" : "🔊";
showMute();
muteBtn.onclick = () => { muted = !muted; try { localStorage.setItem("outwit-muted", muted ? "1" : "0"); } catch {} showMute(); SFX.click(); };
document.addEventListener("click", e => { if (e.target.closest(".big, .mini, .list-row")) SFX.click(); });

/* ===================== BELL CURVE (estimated) =====================
   There's no server collecting everyone's scores yet, so this is an ESTIMATE of how
   players score based on the day's difficulty (tougher rivals = lower average).
   Swap in real scores once there's a leaderboard backend. */
function erf(x){ const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + .3275911 * x);
  return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-x * x)); }
function bellCurve(p, score){
  const max = QPD * MAX_PTS, sd = 1300;
  const mu = Math.max(1800, Math.min(5200, 3800 + (3500 - p.rival.target) * .35));
  const pct = Math.round(50 * (1 + erf((score - mu) / (sd * Math.SQRT2))));
  const N = 35, w = max / N, pdf = x => Math.exp(-((x - mu) ** 2) / (2 * sd * sd));
  const you = Math.min(N - 1, Math.floor(score / w)), riv = Math.min(N - 1, Math.floor(p.rival.target / w));
  const bars = Array.from({length:N}, (_, i) => `<i class="${i === you ? "you" : i < you ? "below" : ""}" data-h="${Math.max(3, Math.round(pdf((i + .5) * w) * 100))}"></i>`).join("");
  const label = score <= 0 ? "EVERYONE STARTS SOMEWHERE" : pct >= 50 ? `TOP ${Math.max(1, 100 - pct)}%` : `BETTER THAN ${pct}%`;
  return {
    html: `<div class="bellbox">
        <div class="bell-head"><span>HOW YOU STACK UP</span><b>${label}</b></div>
        <div class="bell" id="bell">${bars}
          <div class="mark you" style="left:${(you + .5) / N * 100}%">▼ YOU</div>
          <div class="mark riv" style="left:${(riv + .5) / N * 100}%">${p.rival.emoji}</div></div>
        <div class="bell-axis"><span>0</span><span>${fmtNum(max)}</span></div>
        <div class="muted" style="font-size:10px; margin-top:6px">Estimated from today's difficulty</div>
      </div>`,
    grow(){ document.querySelectorAll("#bell i").forEach((b, i) => setTimeout(() => b.style.height = b.dataset.h + "%", i * 18)); }
  };
}

/* ===================== PHONE KEYBOARD =====================
   When the on-screen keyboard opens, keep the text box in view. */
document.addEventListener("focusin", e => {
  if (e.target.tagName === "INPUT" && innerWidth <= 600) setTimeout(() => e.target.scrollIntoView({block:"center", behavior:"smooth"}), 300);
});
if (window.visualViewport) visualViewport.addEventListener("resize", () => {
  const a = document.activeElement;
  if (a && a.tagName === "INPUT") a.scrollIntoView({block:"center", behavior:"smooth"});
});

/* ===================== MIDNIGHT REFRESH ===================== */
function tick(){
  const now = new Date(), cd = document.getElementById("cd");
  if (cd){ const ms = addDays(now, 1) - now;
    cd.textContent = `${pad(Math.floor(ms / 3.6e6))}:${pad(Math.floor(ms % 3.6e6 / 6e4))}:${pad(Math.floor(ms % 6e4 / 1000))}`; }
  const k = keyOf(now);
  if (k !== currentDayKey){ currentDayKey = k; if (!game && !locked) home(); }   // new rival + new scene at 12:00 AM
}
setInterval(tick, 1000);

sizeCanvas();
initAccounts();
locked ? gate() : home();
requestAnimationFrame(loop);
</script>
